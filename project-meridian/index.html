<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Meridian — Workforce Transition Decision Prototype</title>
<style>
:root{
  --ink:#182230; --muted:#667085; --border:#D9DEE7; --canvas:#F6F7F9; --surface:#FFFFFF;
  --primary:#264F77; --primary-strong:#1E3F60; --primary-soft:#EDF3F8;

}
*{box-sizing:border-box}

button:focus-visible,select:focus-visible,[role="button"]:focus-visible,a:focus-visible{outline:3px solid #7BA7D0;outline-offset:2px}
.app-header{height:66px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{width:34px;height:34px;border:1px solid var(--ink);border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.02em;background:#fff}
.brand-title{font-weight:700;font-size:15px;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:620px}
.header-right{display:flex;align-items:center;gap:10px}
.synthetic-tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border);background:#fff;padding:6px 9px;border-radius:999px}
.snapshot-btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;min-width:230px}
.snapshot-btn .top{font-size:12px;font-weight:700}.snapshot-btn .sub{font-size:11px;color:var(--muted);margin-top:1px}
.demo-select{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 28px 8px 10px;color:var(--ink)}
.stagebar{height:50px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:sticky;top:66px;z-index:25}
.stages{width:min(1280px,calc(100% - 68px));display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stage{position:relative;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-radius:8px;border:0;background:transparent;text-align:left}
.stage::after{content:"";position:absolute;right:-7px;width:6px;height:1px;background:var(--border)}
.stage:last-child::after{display:none}.stage .n{width:22px;height:22px;border-radius:999px;border:1px solid var(--border);display:grid;place-items:center;font-size:11px;background:#fff}
.stage.active{background:var(--primary-soft);color:var(--primary)}.stage.active .n{border-color:var(--primary);font-weight:700}.stage.done{color:var(--ink)}.stage.done .n{background:var(--ink);border-color:var(--ink);color:#fff}.stage.blocked{opacity:.48}
.main{width:min(1280px,calc(100% - 68px));margin:0 auto;padding:30px 0 112px}
.screen-head{display:flex;justify-content:space-between;gap:30px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px}.screen-head h1{font-size:31px;line-height:1.2;margin:0;font-weight:680;letter-spacing:-.02em}.screen-head p{max-width:720px;margin:10px 0 0;color:var(--muted);font-size:15px}
.screen-note{font-size:12px;color:var(--muted);padding-top:8px;text-align:right;max-width:290px}
.grid-7-5{display:grid;grid-template-columns:7fr 5fr;gap:22px}.grid-8-4{display:grid;grid-template-columns:8fr 4fr;gap:22px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 0 rgba(16,24,40,.02)}.card-pad{padding:22px}.card h2,.card h3{margin:0}.card-title{font-size:16px;font-weight:700}.meta{font-size:12px;color:var(--muted)}
.label-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.semantic{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700;line-height:1;border:1px solid var(--border);background:#fff}.semantic .icon{font-size:12px}.semantic.validated{color:var(--validated);background:var(--validated-bg);border-color:#BED7C8}.semantic.derived{color:var(--derived);background:var(--derived-bg);border-color:#C9D1E2}.semantic.inferred{color:var(--inferred);background:var(--inferred-bg);border-style:dashed;border-color:#C9BBDA}.semantic.missing{color:var(--missing);background:var(--missing-bg);border-style:dashed}.semantic.contested{color:var(--contested);background:var(--contested-bg);border-color:#E9C77B}.semantic.constraint{color:var(--constraint);background:var(--constraint-bg);border-color:#E4B9B9}.semantic.development{color:var(--development);background:var(--development-bg);border-color:#E7D29A}.semantic.source{color:#344054;background:#fff}
.object-status{border-radius:10px;padding:12px 14px;font-weight:700;font-size:13px;border:1px solid var(--border);display:flex;align-items:center;gap:8px}.object-status.adj{color:var(--derived);background:var(--derived-bg);border-color:#C9D1E2}.object-status.demand{color:var(--validated);background:var(--validated-bg);border-color:#BED7C8}.object-status.demand-missing{color:var(--missing);background:var(--missing-bg);border-style:dashed}.object-status.capacity{color:var(--development);background:var(--development-bg);border-color:#E7D29A}.object-status.decision{color:var(--primary);background:var(--primary-soft);border-color:#BFD0DF}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);margin-bottom:8px}.big-value{font-size:28px;font-weight:700;letter-spacing:-.02em}.medium-value{font-size:21px;font-weight:700}.muted{color:var(--muted)}
.hr{height:1px;background:var(--border);margin:18px 0}.section-stack{display:flex;flex-direction:column;gap:14px}.kv{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #EEF0F3}.kv:last-child{border-bottom:0}.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:0;font-size:14px;font-weight:600}
.relationship{padding:18px 0;display:grid;grid-template-columns:1fr 160px 1fr;align-items:center;gap:16px}.role-box{padding:18px;border:1px solid var(--border);border-radius:12px;background:#fff}.role-box .role-name{font-size:18px;font-weight:700;margin-top:4px}.adj-line{text-align:center;position:relative}.adj-line:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #98A2B3}.adj-line span{position:relative;background:#fff;padding:0 9px;font-size:11px;color:var(--derived);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.boundary{border-left:4px solid var(--derived);background:var(--derived-bg);padding:13px 15px;border-radius:8px;font-size:14px}.boundary strong{display:block;margin-bottom:3px}.boundary.constraint{border-color:var(--constraint);background:var(--constraint-bg)}.boundary.missing{border-color:var(--missing);background:var(--missing-bg)}.boundary.development{border-color:var(--development);background:var(--development-bg)}.boundary.capacity{border-color:var(--development);background:var(--development-bg)}
.cta-bar{margin-top:22px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;bottom:12px;z-index:18;box-shadow:0 8px 24px rgba(16,24,40,.10)}.cta-copy{font-size:13px;color:var(--muted);max-width:720px}.actions{display:flex;align-items:center;gap:10px;flex-shrink:0}.btn{min-height:44px;border-radius:10px;border:1px solid var(--border);padding:10px 14px;font-weight:700;font-size:14px;background:#fff;color:var(--ink)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-strong)}.btn.secondary:hover{background:#F8FAFC}.btn.text{border-color:transparent;background:transparent;color:var(--primary);padding-left:8px;padding-right:8px}.btn[disabled]{cursor:not-allowed;opacity:.46}
.mini-list{display:flex;flex-direction:column;gap:10px}.mini-item{display:flex;align-items:flex-start;gap:10px}.mini-icon{width:24px;height:24px;border:1px solid var(--border);border-radius:7px;display:grid;place-items:center;font-size:12px;flex:0 0 auto}.mini-item strong{font-size:13px}.mini-item p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.capacity-equation{display:grid;grid-template-columns:1fr 36px 1fr 36px 1fr;gap:8px;align-items:center;margin-top:14px}.cap-cell{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fff}.cap-cell .num{font-size:26px;font-weight:700}.cap-cell .lbl{font-size:11px;color:var(--muted);margin-top:2px}.operator{text-align:center;font-weight:700;color:var(--muted)}
.requirement-list{display:flex;flex-direction:column;gap:10px}.req{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-bottom:1px solid #EEF0F3;padding:10px 0}.req:last-child{border-bottom:0}.req-name{font-size:13px;font-weight:600}.req-sub{font-size:11px;color:var(--muted);margin-top:2px}.req-level{font-size:13px;font-weight:700}
.claim-list{display:flex;flex-direction:column;gap:12px}.claim{padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff}.claim-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.claim-name{font-size:15px;font-weight:700}.claim-level{font-size:22px;font-weight:700;margin-top:5px}.claim-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.claim-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid #EEF0F3}.evidence-count{font-size:12px;color:var(--muted)}
.provenance-preview{position:sticky;top:138px}.prov-box{padding:18px}.prov-empty{border:1px dashed var(--border);border-radius:10px;padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
.table-wrap{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;background:#F9FAFB;padding:11px 14px;border-bottom:1px solid var(--border)}td{font-size:13px;padding:13px 14px;border-bottom:1px solid #EEF0F3;vertical-align:top}tr:last-child td{border-bottom:0}.finding{display:flex;align-items:flex-start;gap:8px;font-weight:700;font-size:12px}.finding .symbol{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--border);flex:0 0 auto}.finding.met{color:var(--validated)}.finding.dev{color:var(--development)}.finding.evidence{color:var(--missing)}.finding.hard{color:var(--constraint)}.finding.demand{color:var(--missing)}
.changed{border:1px solid #BFD0DF;background:var(--primary-soft);border-radius:14px;padding:18px;margin-bottom:18px}.changed-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.changed h2{font-size:16px;margin:0}.delta-list{display:flex;flex-direction:column;gap:9px;margin-top:12px}.delta{display:grid;grid-template-columns:1.2fr 1fr 32px 1fr 1.25fr;gap:8px;align-items:center;background:#fff;border:1px solid #D5E0EA;border-radius:10px;padding:10px 12px;font-size:12px}.delta .arrow{text-align:center;color:var(--muted);font-weight:700}.delta .new{font-weight:700;color:var(--validated)}.delta .why{color:var(--muted)}
.decision-stack{display:flex;flex-direction:column;gap:16px}.decision-panel,.capacity-panel,.action-panel{border-radius:15px;padding:22px;background:#fff;border:1px solid var(--border)}.decision-panel{border-color:#BFD0DF;background:linear-gradient(180deg,#F9FBFD 0,#fff 100%)}.decision-state{font-size:30px;font-weight:700;color:var(--primary);margin-top:4px}.capacity-panel{border-color:#E7D29A;background:var(--development-bg)}.capacity-title{font-size:24px;font-weight:700;color:var(--development)}.capacity-numbers{display:flex;gap:46px;margin:16px 0 4px}.capacity-num .n{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}.capacity-num .t{font-size:12px;color:var(--muted);max-width:180px}.action-panel{box-shadow:var(--shadow)}.action-panel .action-title{font-size:20px;font-weight:700;margin-bottom:5px}.governance{margin-top:13px;border-left:4px solid var(--ink);padding:10px 12px;background:#F8FAFC;border-radius:7px;font-size:13px}.rationale{margin-top:14px}
.snapshot-pop{position:fixed;right:34px;top:68px;width:430px;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:12px;padding:16px;z-index:50;display:none}.snapshot-pop.open{display:block}.snapshot-pop h3{margin:0 0 6px;font-size:15px}.snapshot-table{width:100%;margin-top:10px}.snapshot-table td{padding:8px 6px;font-size:11px}.snapshot-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}.stale{color:var(--constraint);font-weight:700}
.drawer-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.22);z-index:60;display:none}.drawer-backdrop.open{display:block}.drawer{position:fixed;top:0;right:0;height:100vh;width:510px;max-width:58vw;background:#fff;border-left:1px solid var(--border);box-shadow:-12px 0 30px rgba(16,24,40,.12);z-index:70;transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawer-head{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px}.drawer-head h2{font-size:18px;margin:0}.drawer-body{padding:20px;overflow:auto;flex:1}.icon-btn{width:40px;height:40px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:18px}.evidence-item{padding:14px 0;border-bottom:1px solid #EEF0F3}.evidence-item:last-child{border-bottom:0}.evidence-item h3{font-size:13px;margin:6px 0 3px}.evidence-item p{font-size:12px;color:var(--muted);margin:0}.not-proves{margin-top:18px;border:1px dashed var(--border);padding:13px;border-radius:10px;font-size:12px;background:#F9FAFB}.source-chip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;border:1px solid var(--border);padding:3px 6px;border-radius:6px;color:var(--muted);background:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:1180px){.brand-sub{max-width:430px}.grid-7-5,.grid-8-4{grid-template-columns:1fr}.provenance-preview{position:static}.relationship{grid-template-columns:1fr 120px 1fr}.main,.stages{width:calc(100% - 44px)}.app-header{padding:0 22px}.snapshot-pop{right:22px}}
@media (max-width:1060px){body{min-width:0}.snapshot-btn{min-width:190px}.stage{padding:7px 6px;font-size:11px}.stage span:last-child{white-space:nowrap}.capacity-equation{grid-template-columns:1fr 28px 1fr 28px 1fr}.delta{grid-template-columns:1fr 1fr 26px 1fr}.delta .why{grid-column:1 / -1}.screen-head h1{font-size:28px}}

@media (min-width:1100px){
  .decision-stack{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .action-panel{grid-column:1 / -1;display:grid;grid-template-columns:1fr auto;column-gap:20px;align-items:center}
  .action-panel .actions{grid-column:2;grid-row:1 / span 2;margin-top:0!important}
  .action-panel .governance{grid-column:1 / -1}
}

@media (max-height:780px) and (min-width:1100px){
  .main{padding-top:24px;padding-bottom:112px}
  .screen-head{margin-bottom:16px}
  .screen-head h1{font-size:29px}
  .screen-head p{margin-top:7px}
  .card-pad{padding:18px}
  .main > .cta-bar{position:sticky;bottom:12px;z-index:18;box-shadow:0 8px 24px rgba(16,24,40,.13)}
  .decision-stack{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .decision-panel,.capacity-panel,.action-panel{padding:18px}
  .action-panel{grid-column:1 / -1;display:grid;grid-template-columns:1fr auto;column-gap:20px;align-items:center}
  .action-panel .actions{grid-column:2;grid-row:1 / span 2;margin-top:0!important}
  .action-panel .governance{grid-column:1 / -1}
  .decision-state{font-size:27px}
  .capacity-title{font-size:22px}
  .capacity-numbers{margin:10px 0 2px;gap:32px}
  .capacity-num .n{font-size:30px}
  .changed{padding:14px;margin-bottom:14px}
  .delta-list{gap:7px;margin-top:9px}
  .delta{padding:8px 10px}
  th{padding-top:9px;padding-bottom:9px}
  td{padding-top:10px;padding-bottom:10px}
}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">M</div>
    <div>
      <div class="brand-title">Project Meridian</div>
      <div class="brand-sub">Transition Case · M-017 → Smart Meter Field Service</div>
    </div>
  </div>
  <div class="header-right">
    <span class="synthetic-tag">Synthetic pilot case</span>
    <select class="demo-select" id="scenarioSelect" aria-label="Demo state">
      <option value="hero">Hero journey</option>
      <option value="no-demand">Alternate · Demand not validated</option>
      <option value="insufficient">Alternate · Evidence insufficient</option>
      <option value="contested">Alternate · Evidence contested</option>
      <option value="cert-unresolved">Alternate · Certification unresolved</option>
    </select>
    <button class="snapshot-btn" id="snapshotBtn" aria-haspopup="dialog" aria-expanded="false">
      <div class="top" id="snapshotTop">Decision Snapshot DS-017 v3</div>
      <div class="sub" id="snapshotSub">As of 18 Sep 2026 · 16:00 WIB</div>
    </button>
  </div>
</header>
<nav class="stagebar" aria-label="Case decision stages">
  <div class="stages" id="stageNav"></div>
</nav>
<div class="snapshot-pop" id="snapshotPop" role="dialog" aria-label="Decision snapshot details">
  <h3 id="snapshotPopTitle">Decision Snapshot DS-017 v3</h3>
  <div class="meta">Coherent decision state using validated records available at the snapshot boundary.</div>
  <table class="snapshot-table" aria-label="Critical input dates"><tbody id="snapshotRows"></tbody></table>
</div>
<main class="main" id="app" tabindex="-1"></main>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <div><div class="eyebrow">Provenance</div><h2 id="drawerTitle">Evidence details</h2></div>
    <button class="icon-btn" id="drawerClose" aria-label="Close evidence drawer">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  const stages=["Case","Pathway","Evidence","Fit & Constraints","Decision"];
  const state={stage:0, scenario:"hero", snapshot:3, applied:false, lastFocus:null};
  const app=document.getElementById('app');
  const stageNav=document.getElementById('stageNav');
  const scenarioSelect=document.getElementById('scenarioSelect');
  const snapshotBtn=document.getElementById('snapshotBtn');
  const snapshotPop=document.getElementById('snapshotPop');
  const snapshotTop=document.getElementById('snapshotTop');
  const snapshotSub=document.getElementById('snapshotSub');
  const snapshotPopTitle=document.getElementById('snapshotPopTitle');
  const snapshotRows=document.getElementById('snapshotRows');
  const drawer=document.getElementById('drawer');
  const drawerBackdrop=document.getElementById('drawerBackdrop');
  const drawerClose=document.getElementById('drawerClose');
  const drawerTitle=document.getElementById('drawerTitle');
  const drawerBody=document.getElementById('drawerBody');
  const toast=document.getElementById('toast');

  const snapshotData={
    3:{title:'Decision Snapshot DS-017 v3',time:'As of 18 Sep 2026 · 16:00 WIB',rows:[
      ['Destination demand','Validated 17 Sep · 15:10'],['Device-service claim','Validated 16 Sep · 09:30'],['Digital diagnostics claim','L1 validated 12 Sep · 14:00'],['Technical certification','Unverified at snapshot'],['Candidate-pool capacity','Validated 18 Sep · 15:45']
    ]},
    4:{title:'Decision Snapshot DS-017 v4',time:'As of 19 Sep 2026 · 11:07 WIB',rows:[
      ['Destination demand','Validated 17 Sep · 15:10'],['Device-service claim','Validated 16 Sep · 09:30'],['Digital diagnostics claim','L2 validated 19 Sep · 10:20'],['Technical certification','Verified 19 Sep · 11:05'],['Candidate-pool capacity','Validated 19 Sep · 10:55']
    ]}
  };

  function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
  function semantic(text,kind='source',icon='•'){return `<span class="semantic ${kind}"><span class="icon" aria-hidden="true">${icon}</span>${text}</span>`;}
  function btn(text,id,kind='primary',disabled=false){return `<button class="btn ${kind}" id="${id}" ${disabled?'disabled':''}>${text}</button>`;}
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
  function setStage(n){state.stage=n; render(); window.scrollTo({top:0,behavior:'auto'}); setTimeout(()=>app.focus({preventScroll:true}),0)}
  function maxStage(){
    if(state.scenario==='no-demand') return 1;
    if(state.scenario==='insufficient'||state.scenario==='contested') return 2;
    if(state.scenario==='cert-unresolved') return 3;
    if(state.scenario==='hero') return state.applied?4:3;
    return 4;
  }
  function renderNav(){
    const mx=maxStage();

      claimCard('Meter Device Inspection & Service','L2','validated','Validated','Movement consideration · field-service context','16 Sep 2026','3 relevant source records','device');

  }

  function row(req,need,person,type,label,detail){
    const map={met:['met','✓'],dev:['dev','↑'],evidence:['evidence','?'],hard:['hard','⌧'],demand:['demand','∅']}; const [cl,sym]=map[type];
    return `<tr><td><strong>${req}</strong></td><td>${need}</td><td>${person}</td><td><div class="finding ${cl}"><span class="symbol" aria-hidden="true">${sym}</span><div>${label}<div class="meta" style="margin-top:2px">${detail}</div></div></div></td></tr>`;
  }
  function s4(){
    const certBlocked=state.scenario==='cert-unresolved';
    const digitalPerson=state.applied?'Validated L2':'Validated L1';
    const certPerson=state.applied?'Verified current':'Unverified';
    const rows=[
      row('Meter Device Inspection & Service','L2','Validated L2','met','Requirement met','Current scoped claim meets destination requirement.'),
      state.applied?row('Digital Device Diagnostics','L2','Validated L2','met','Requirement met','Targeted assessment now supports L2.'):row('Digital Device Diagnostics','L2','Validated L1','dev','Development requirement','Demonstrated L1; destination requires L2.'),
      row('Field Safety & Compliance','L2','Validated L2','met','Requirement met','Current scoped claim meets destination requirement.'),
      row('AMI Communications Fundamentals','L1','Supported L1','met','Requirement met','Supported for candidate consideration in this synthetic case.'),
      (state.applied&&!certBlocked)?row('Technical Certification','Current','Verified current','met','Eligibility cleared','Authoritative certification record verified.'):row('Technical Certification','Current','Unverified','hard','Hard constraint','Required certification is not yet verified.'),
      row('Geography','West Region','West Region','met','Requirement met','Location compatible in this synthetic case.')

    const snapshotNote=state.applied?'Decision Snapshot DS-017 v4 · validated updates applied':certBlocked?'Decision Snapshot DS-017 v3 · certification unresolved':'Decision Snapshot DS-017 v3 · causal updates shown before re-evaluation';
    return `${screenHeader(4,'What is actually blocking progression?','Compare destination requirements with evidence-backed person claims. Different problems stay different: development, missing evidence and hard constraints are not one score.',snapshotNote)}

      ${certBlocked?`<div class="boundary constraint" style="margin-top:18px"><strong>Person Decision State · Constraint-Blocked</strong>Capability evidence remains intact. The current blocker is eligibility: the required technical certification is unverified.</div>`:(!state.applied?`<div class="boundary development" style="margin-top:18px"><strong>Two different obstacles are active in DS-017 v3.</strong>Digital Diagnostics is a bounded development requirement; certification is a separate eligibility constraint. The newly validated records above resolve them independently.</div>`:`<div class="boundary" style="margin-top:18px"><strong>Validated updates applied.</strong>Digital Diagnostics now meets L2 and certification is verified. These changes created DS-017 v4; the next decision state is shown separately.</div>`)}

  }

  function render(){

    if(state.stage>maxStage()) state.stage=maxStage();

  function wire(){
    const $=id=>document.getElementById(id);
    if($('next1')) $('next1').onclick=()=>setStage(1);
    if($('next2')) $('next2').onclick=()=>setStage(2);
    if($('next3')) $('next3').onclick=()=>setStage(3);
    if($('next4')) $('next4').onclick=()=>setStage(4);
    if($('inspectSource')) $('inspectSource').onclick=()=>showToast('Source-work details are represented in this bounded prototype; no full taxonomy editor is included.');
    if($('demandProv')) $('demandProv').onclick=()=>openDrawer('Demand provenance', demandProvenanceHtml(state.scenario==='no-demand'));
    if($('demandRequest')) $('demandRequest').onclick=()=>showToast('Demand validation request prepared. Person evaluation remains blocked.');
    if($('assessmentReq')) $('assessmentReq').onclick=()=>showToast('Targeted assessment requested. No capability conclusion has been made.');
    if($('evidenceReview')) $('evidenceReview').onclick=()=>showToast('Contested claim escalated for evidence review.');
    if($('certReq')) $('certReq').onclick=()=>showToast('Certification verification requested. Capability claims remain unchanged.');
    if($('reevaluate')) $('reevaluate').onclick=()=>{
      showToast('Applying 2 validated updates…');
      setTimeout(()=>{state.applied=true;state.snapshot=4;render();setTimeout(()=>setStage(4),220)},480);
    };
    if($('submitAllocation')) $('submitAllocation').onclick=()=>showToast('Submitted to allocation review. No ranking or allocation performed.');
    if($('decisionRationale')) $('decisionRationale').onclick=()=>openDrawer('Decision rationale', decisionRationaleHtml());
    document.querySelectorAll('.evidenceBtn').forEach(b=>b.addEventListener('click',()=>openEvidence(b.dataset.claim,b)));
  }

    return `<div class="label-row">${semantic('Synthetic Client record','source','▣')}${semantic('Validated demand','validated','✓')}</div><div class="evidence-item"><h3>Demand plan · DMD-WEST-017</h3><p>Gross requirement 80 positions · required Q3 2027 · West Region · durable operating need.</p><div style="margin-top:7px"><span class="source-chip">Synthetic record</span></div></div><div class="evidence-item"><h3>Committed supply record · SUP-WEST-017</h3><p>30 positions already staffed or committed. Net internal capacity therefore equals 50.</p><div style="margin-top:7px"><span class="source-chip">Synthetic record</span></div></div><div class="evidence-item"><h3>Business validation</h3><p>Validated by Regional Operations Planning on 17 Sep 2026 at 15:10 WIB for prototype demonstration.</p></div><div class="not-proves"><strong>What this does not establish</strong><br>It does not establish that any specific person qualifies for the opportunity.</div>`;
  }

  function openEvidence(id,trigger){
    const d=evidenceContent[id]||evidenceContent.device; const scope=typeof d.scope==='function'?d.scope():d.scope; const items=typeof d.items==='function'?d.items():d.items; const not=typeof d.not==='function'?d.not():d.not;
    const scopeSem=scope.includes('Validated')?semantic('Scoped validation','validated','✓'):scope.includes('No movement use')?semantic('Decision-limited','contested','!'):semantic('Decision-limited','missing','○');
    const html=`<div class="label-row">${semantic('Capability claim','derived','◇')}${scopeSem}</div><p style="font-weight:700;margin-top:14px">${esc(scope)}</p><div class="hr"></div><div class="kicker">Why we believe this</div>${items.map(([a,b,c])=>`<div class="evidence-item"><div class="label-row">${semantic(c.startsWith('Measured')?'Measured':c.startsWith('Observed')?'Observed':c.startsWith('Validated')?'Validated input':'Source record',c.startsWith('Validated')?'validated':'source',c.startsWith('Validated')?'✓':'▣')}</div><h3>${esc(a)}</h3><p>${esc(b)}</p><div style="margin-top:7px"><span class="source-chip">${esc(c)}</span></div></div>`).join('')}<div class="not-proves"><strong>What this claim does not establish</strong><br>${esc(not)}</div>`;
    openDrawer(d.title,html,trigger);
  }
  function decisionRationaleHtml(){return `<div class="label-row">${semantic('Person state · Actionable','derived','◇')}${semantic('Capacity condition · Constrained','development','!')}</div><div class="evidence-item"><h3>Why this pathway is real</h3><p>Synthetic Work Opportunity demand is validated at 50 net positions in West Region for Q3 2027.</p></div><div class="evidence-item"><h3>Why M-017 is actionable</h3><p>Required capability claims are scoped for movement consideration, bounded development has been validated at L2, and the certification constraint is verified in DS-017 v4.</p></div><div class="evidence-item"><h3>Why the system still stops</h3><p>Candidate-pool snapshot CP-017 v2 contains 120 actionable candidates for 50 net positions. No approved allocation criteria are established by the assignment.</p></div><div class="not-proves"><strong>Governance boundary</strong><br>Non-allocation would be a capacity/allocation outcome, not evidence that M-017's validated capability claims are wrong.</div>`}

  function openDrawer(title,html,trigger){
    state.lastFocus=trigger||document.activeElement; drawerTitle.textContent=title; drawerBody.innerHTML=html; drawer.classList.add('open');drawerBackdrop.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>drawerClose.focus(),0)
  }
  function closeDrawer(){drawer.classList.remove('open');drawerBackdrop.classList.remove('open');document.body.style.overflow='';if(state.lastFocus&&state.lastFocus.focus)state.lastFocus.focus()}
  drawerClose.addEventListener('click',closeDrawer); drawerBackdrop.addEventListener('click',closeDrawer);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&drawer.classList.contains('open')){closeDrawer();return}
    if(e.key==='Tab'&&drawer.classList.contains('open')){
      const f=[...drawer.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null); if(!f.length)return; const first=f[0],last=f[f.length-1]; if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()} else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  });

  render();
})();
</script>
